<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バンドTシャツ｜商品照合一覧</title>
<style>
:root{color-scheme:light;--ink:#173328;--muted:#53655c;--line:#cfdbcf;--deep:#153b2f;--paper:#f7f8f3;--lime:#e2f399;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
body,h1,h2,p{margin:0}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #407395;outline-offset:3px}
[hidden]{display:none!important}
header{background:var(--deep);color:#fff}
.wrap{width:min(100% - 40px,1240px);margin-inline:auto}
header .wrap{min-height:130px;display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{font-size:clamp(25px,3.7vw,40px);letter-spacing:.01em;line-height:1.25}
header p{font-size:14px;color:#deeadf;margin-top:5px}
.inventory-count{font-weight:700;font-size:18px;white-space:nowrap;color:var(--lime);font-variant-numeric:tabular-nums}
.inventory-count b{font-size:30px}
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:24px 0 18px}
.searchbox{position:relative;display:block;flex:0 1 380px}
.searchbox:before{content:"";position:absolute;top:15px;left:16px;width:11px;height:11px;border:2px solid #53655c;border-radius:50%;pointer-events:none}
.searchbox:after{content:"";position:absolute;top:28px;left:28px;width:7px;height:2px;background:#53655c;transform:rotate(45deg);pointer-events:none}
input{min-height:48px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 43px}
input::placeholder{color:#586a60}
.filters{display:flex;gap:3px;border:1px solid var(--line);border-radius:10px;background:#e9eee7;padding:3px}
.filters button{padding:4px 16px;min-height:40px;border:0;border-radius:7px;background:transparent;font-size:14px;font-weight:650}
.filters button[aria-pressed="true"]{color:#fff;background:var(--deep)}
.results{margin-bottom:10px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:17px;margin-bottom:48px}
.card{min-width:0;width:100%;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.card:hover,.card:focus-visible{border-color:#50725f;box-shadow:0 2px 8px #12332118}
.photo{width:100%;aspect-ratio:4 / 3;background:#e8e7df;display:block;object-fit:contain}
.info{display:block;padding:12px}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.code{font:700 18px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em}
.sleeve{font-size:12px;line-height:1.5;font-weight:650;border-radius:4px;padding:1px 6px;color:#2e5843;background:#e6efe6}
.sleeve.long{color:#583b68;background:#f0e8f4}
.name{display:block;margin-top:6px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
#empty{padding:22px 0;color:var(--muted)}
dialog{width:min(640px,calc(100% - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:15px;color:var(--ink);background:#fff;box-shadow:0 20px 70px #12332142}
dialog::backdrop{background:#10231bba}
body:has(dialog[open]){overflow:hidden}
.detail-head, .detail-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px}
.detail-head h2{font:700 23px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
.detail-head p{font-size:14px;overflow-wrap:anywhere;margin-top:4px}
#zoom{display:block;width:100%;height:auto;max-height:62dvh;object-fit:contain;background:#e8e7df}
.action{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-height:44px;font-weight:650;white-space:nowrap}
.action:disabled{opacity:.4;cursor:default}
#position{font-size:13px;color:var(--muted)}
@media(max-width:640px){.wrap{width:calc(100% - 28px)}header .wrap{min-height:100px;gap:10px}.inventory-count{font-size:14px}.inventory-count b{font-size:23px}.tools{margin:16px 0 12px;gap:10px}.searchbox{flex-basis:100%}.filters{width:100%}.filters button{flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:9px}.code{font-size:16px}.name{font-size:13px}.detail-head,.detail-foot{padding:12px}}

.tabs{display:flex;gap:5px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:9px 12px;min-height:44px;font-weight:700}
.tabs button[aria-current="page"]{color:var(--deep);border-color:var(--deep)}
.test-note{background:#ecf1df;border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.order-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.primary{background:var(--deep);border-color:var(--deep);color:white}
#cart-bar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));width:100%;box-shadow:0 3px 16px #17332833;margin-bottom:12px}
#pick-open{display:block;width:calc(100% - 32px);margin:12px auto 0}
#pick-sheet{width:min(440px,calc(100% - 24px));padding:20px;overscroll-behavior:contain}
#pick-sheet::backdrop{background:#10231b66}
.pick-heading,.pick-row,.pick-product,.stepper{display:flex;align-items:center;gap:12px}
.pick-heading,.pick-row{justify-content:space-between}
.pick-heading h2{font-size:20px}
.pick-product{margin:14px 0;padding:12px;background:var(--paper);border-radius:10px}
.pick-product img{width:76px;height:60px;object-fit:contain}
.pick-row{padding:12px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stepper{gap:8px}
.stepper button{width:46px;height:46px;padding:0;font-size:22px;touch-action:manipulation}
.stepper output{min-width:3ch;text-align:center;font-size:20px;font-weight:700}
.pick-buttons{display:flex;gap:8px;margin-top:12px}
.pick-buttons .primary{flex:1}
@media(max-width:640px){
 #pick-sheet{position:fixed;inset:auto 0 0;margin:0 auto;width:100%;max-height:calc(100dvh - 12px);border-radius:20px 20px 0 0;padding:16px 18px max(18px,env(safe-area-inset-bottom))}
}
@media(max-width:640px) and (prefers-reduced-motion:no-preference){
 #pick-sheet[open]{animation:pick-rise .22s ease-out}
 @keyframes pick-rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
}
#history-list{display:grid;gap:10px;margin:12px 0}
.history-row,.order-line{padding:12px;border:1px solid var(--line);border-radius:10px;background:white}
.history-row{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px}
.order-line{display:flex;align-items:center;gap:10px;margin:7px 0}
.order-line img{width:60px;height:68px;object-fit:contain;background:#eee}
.order-line .item-copy{flex:1;min-width:0;overflow-wrap:anywhere}
.order-line small,.history-row small{display:block;color:var(--muted)}
.order-line input{padding:5px;width:62px}
#order-dialog{padding:16px}
#order-dialog .detail-head{padding:0 0 8px}
#order-message{position:fixed;z-index:3;bottom:70px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:8px 12px;border-radius:8px;background:var(--deep);color:white}
.form-error{color:#8d3129}
@media(max-width:400px){.tabs button{padding:8px}.order-line{gap:6px;padding:7px}.order-line img{width:46px}}
@media print{
 @page{size:A4 portrait;margin:12mm}
 body:has(#order-dialog[open]){overflow:visible}
 body:has(#order-dialog[open])> :not(#order-dialog){display:none!important}
 #order-dialog[open]{position:static;display:block;overflow:visible;width:100%;max-height:none;border:0;box-shadow:none;padding:0;margin:0}
 #order-dialog::backdrop{background:none}
 #order-dialog button,#order-dialog .order-actions{display:none!important}
 .order-line{break-inside:avoid}
}

<p id="empty" hidden>該当する商品がありません。品番や袖丈を確認してください。</p>
<button class="action primary" id="cart-bar" hidden>カートを確認</button>
</section>
<section id="history-view" hidden><h2>注文履歴</h2><p id="history-empty" class="results">このブラウザに保存したテスト注文はありません。</p><div id="history-list"></div></section>
<p id="order-message" role="status" hidden></p>
</main>
<dialog id="detail" aria-labelledby="detail-code" aria-describedby="detail-name">
<div class="detail-head"><div><div class="meta"><h2 id="detail-code"></h2><span id="detail-sleeve" class="sleeve"></span></div><p id="detail-name"></p></div><button class="action" id="close" autofocus>閉じる</button></div>
<img id="zoom" alt="">
<button type="button" id="pick-open" class="action primary" aria-haspopup="dialog" hidden>注文数を選ぶ</button>
<div class="detail-foot"><button class="action" id="prev">前の商品</button><span id="position"></span><button class="action" id="next">次の商品</button></div>
</dialog>
<dialog id="pick-sheet" aria-labelledby="pick-title">
<div class="pick-heading"><h2 id="pick-title" tabindex="-1" autofocus>注文数を選ぶ</h2><button class="action" id="pick-close">閉じる</button></div>
<div class="pick-product"><img id="pick-photo" alt=""><div><div class="meta"><strong class="code" id="pick-code"></strong><span id="pick-sleeve"></span></div><span class="name" id="pick-name"></span></div></div>
<div class="pick-row"><span>注文数</span><div class="stepper">
<button class="action" id="pick-minus" aria-label="1点減らす">−</button><output id="pick-qty" aria-label="注文数"></output><button class="action" id="pick-plus" aria-label="1点増やす">＋</button>
</div></div>
<div class="pick-row" id="pick-amount" hidden><span>小計</span><strong></strong></div>
<p id="pick-error" class="form-error" role="alert" hidden></p>
<div class="pick-buttons"><button class="action" id="pick-back" hidden>点数を変更</button><button class="action primary" id="pick-review">確認する</button><button class="action primary" id="pick-save" hidden>カートに追加</button></div>
</dialog>
<dialog id="order-dialog" aria-labelledby="order-title"><div class="detail-head"><h2 id="order-title"></h2><button class="action" id="order-close">閉じる</button></div><div id="order-body"></div><p id="order-error" class="form-error" role="alert" hidden></p></dialog>
<script>
'use strict';
const get = s => document.querySelector(s);
const cards = Array.from(document.querySelectorAll('.card'));
const filters = Array.from(document.querySelectorAll('[data-filter]'));
const search = get('#search');
const detail = get('#detail');
const visible = () => cards.filter(card => !card.hidden);
function fold(value) {
  return value.normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .replace(/[\s・.'’/＆&-]/g, '');
}
let sleeve = 'all';
let selected;
function filterCards() {
  const term = fold(search.value);
  let count = 0;
  for (const card of cards) {
    card.hidden = !(sleeve === 'all' || card.dataset.code.startsWith(sleeve)) ||
      !fold(card.dataset.code + ' ' + card.querySelector('.name').textContent).includes(term);
    if (!card.hidden) count++;
  }
  get('#results').textContent = count + ' 件を表示';
  get('#empty').hidden = count !== 0;
}
for (const button of filters) button.addEventListener('click', () => {
  sleeve = button.dataset.filter;
  for (const b of filters) b.setAttribute('aria-pressed', String(b === button));
  filterCards();
});
search.addEventListener('input', filterCards);
function show(card) {
  selected = card;
  const shown = visible();
  const n = shown.indexOf(card);
  const code = card.dataset.code;
  const name = card.querySelector('.name').textContent;
  const tag = card.querySelector('.sleeve');
  get('#detail-code').textContent = code;
  get('#detail-sleeve').textContent = tag.textContent;
  get('#detail-sleeve').className = tag.className;
  get('#detail-name').textContent = name;
  get('#zoom').src = card.querySelector('img').getAttribute('src');
  get('#zoom').alt = code + ' ' + name + ' の拡大写真';
  get('#position').textContent = (n + 1) + ' / ' + shown.length;
  get('#prev').disabled = n === 0;
  get('#next').disabled = n === shown.length - 1;
  detail.dispatchEvent(new Event('productchange'));
  if (!detail.open) detail.showModal();
}
function step(d) {
  const shown = visible();
  const card = shown[shown.indexOf(selected) + d];
  if (card) show(card);
}
get('#grid').addEventListener('click', event => {
  const card = event.target.closest('.card');
  if (card) show(card);
});
get('#close').addEventListener('click', () => detail.close());
get('#prev').addEventListener('click', () => step(-1));
get('#next').addEventListener('click', () => step(1));
detail.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
detail.addEventListener('click', e => {
  const r = detail.getBoundingClientRect();
  if (e.target === detail && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) detail.close();
});
</script>
<script>(() => {
  'use strict';
  const tabs = Array.from(document.querySelectorAll('[data-view]'));
  const orderDialog = get('#order-dialog');
  const body = get('#order-body');
  const pickSheet = get('#pick-sheet');
  const pickOpen = get('#pick-open');
  let pickQty = 1;
  let previousQty = 0;
  const products = new Map(cards.map(card => [card.dataset.code, {
    code: card.dataset.code,
    name: card.querySelector('.name').textContent,
    image: card.querySelector('img').getAttribute('src')
  }]));
  let view = 'catalog';
  let draft = [];
  let dbPromise;
  let busy = false;
  let messageTimer;
  let photoURLs = [];

  function database() {
    if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
      // GitHub Pages の同一ドメインにある別アプリとは台帳を共有しない。
      const open = indexedDB.open('band-shirt-test-orders:' + new URL('.', location.href).pathname, 1);
      open.onupgradeneeded = () => {
        const db = open.result;
        db.createObjectStore('draft', {keyPath:'code'});
        db.createObjectStore('orders', {keyPath:'id', autoIncrement:true});
        db.createObjectStore('photos');
      };
      open.onsuccess = () => resolve(open.result);
      open.onerror = () => reject(open.error);
    }).catch(error => { dbPromise = null; throw error; });
    return dbPromise;
  }
  function read(request) {
    return new Promise((resolve,reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }
  function completed(tx) {
    return new Promise((resolve,reject) => {
      tx.oncomplete = resolve;
      tx.onabort = () => reject(tx.error || new Error('注文内容が変わりました。再確認してください。'));
      tx.onerror = () => {}; // abort で確定した結果を通知する。
    });
  }
  async function all(store) {
    const db = await database();
    return read(db.transaction(store).objectStore(store).getAll());
  }
  function qtyTotal(lines) { return lines.reduce((sum, line) => sum + line.qty, 0); }
  function number(id) { return 'TEST-' + String(id).padStart(4,'0'); }
  function dateLabel(created) { return new Date(created).toLocaleString('ja-JP',{dateStyle:'short',timeStyle:'short'}); }
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function action(text, handler, primary = false) {
    const btn = el('button',text,'action' + (primary ? ' primary' : ''));
    btn.type = 'button';
    btn.onclick = handler;
    return btn;
  }
  function notice(text) {
    const n = get('#order-message');
    n.textContent = text; n.hidden = false;
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => n.hidden = true,3500);
  }
  function errorMessage(text) {
    const node = orderDialog.open ? get('#order-error') : pickSheet.open ? get('#pick-error') : get('#order-message');
    clearTimeout(messageTimer);
    node.textContent = text;
    node.hidden = false;
  }
  async function run(fn) {
    if (busy) return;
    busy = true;
    document.querySelector("main").inert = true;
    try { await fn(); }
    catch (error) {
      errorMessage(error.name === 'QuotaExceededError' ? '保存容量が足りません。カートを保持しました。' :
        (error.name === 'Error' ? error.message : '保存領域を利用できません。通常のブラウザで開き直してください。'));
    } finally { busy = false; document.querySelector("main").inert = false; }
  }
  function updateBar() {
    get('#cart-bar').textContent = 'カートを確認　' + qtyTotal(draft) + ' 点';
  }
  async function changeDraft(code, qty, previous) {
    if (!Number.isInteger(qty) || qty < 0 || qty > 99999) throw new Error('点数は1〜99,999で入力してください。');
    const db = await database();
    const tx = db.transaction('draft','readwrite');
    const done = completed(tx);
    const store = tx.objectStore('draft');
    const req = store.get(code);
    req.onsuccess = () => {
      if ((req.result?.qty || 0) !== previous) { tx.abort(); return; }
      if (qty) store.put({...products.get(code),qty});
      else store.delete(code);
    };
    try { await done; }
    finally { draft = await all('draft'); updateBar(); }
  }
  function configurePick() {
    pickOpen.hidden = view !== 'create';
    const existing = draft.find(row => row.code === selected.dataset.code);
    pickOpen.textContent = existing ? '注文数を変更（' + existing.qty + '点）' : '注文数を選ぶ';
  }
  detail.addEventListener('productchange',configurePick);

  function setPickQty(qty) {
    pickQty = qty;
    get('#pick-qty').value = qty.toLocaleString('ja-JP') + ' 点';
    get('#pick-minus').disabled = qty <= 1;
    get('#pick-plus').disabled = qty >= 99999;
  }
  function showPickStep(review) {
    get('#pick-title').textContent = review ? '追加内容の確認' : '注文数を選ぶ';
    get('#pick-minus').hidden = get('#pick-plus').hidden = review;
    get('#pick-review').hidden = review;
    get('#pick-back').hidden = get('#pick-save').hidden = !review;
    get('#pick-amount').hidden = !review;
    if (review) {
      const unitPrice = selected.dataset.code.startsWith('SS') ? 2000 : 2900;
      get('#pick-amount strong').textContent = (pickQty * unitPrice).toLocaleString('ja-JP') + ' 円';
      get('#pick-save').textContent = previousQty ? 'カートの点数を更新' : 'カートに追加';
      if (previousQty) get('#pick-title').textContent = '変更内容の確認';
    }
    if (pickSheet.open) get('#pick-title').focus();
  }
  pickOpen.onclick = () => {
    const code = selected.dataset.code;
    const product = products.get(code);
    previousQty = draft.find(row => row.code === code)?.qty || 0;
    get('#pick-photo').src = product.image;
    get('#pick-code').textContent = code;
    get('#pick-name').textContent = product.name;
    get('#pick-sleeve').textContent = get('#detail-sleeve').textContent;
    get('#pick-sleeve').className = get('#detail-sleeve').className;
    get('#pick-error').hidden = true;
    setPickQty(previousQty || 1);
    showPickStep(false);
    pickSheet.showModal();
  };
  get('#pick-minus').onclick = () => setPickQty(pickQty - 1);
  get('#pick-plus').onclick = () => setPickQty(pickQty + 1);
  get('#pick-close').onclick = () => { if (!busy) pickSheet.close(); };
  pickSheet.addEventListener('cancel',event => { if (busy) event.preventDefault(); });
  get('#pick-review').onclick = () => showPickStep(true);
  get('#pick-back').onclick = () => { if (!busy) showPickStep(false); };
  get('#pick-save').onclick = () => run(async () => {
    const code = selected.dataset.code;
    const save = get('#pick-save');
    save.disabled = true;
    try {
      await changeDraft(code,pickQty,previousQty);
      pickSheet.close();
      detail.close();
      notice(code + ' をカートに保存しました。');
    } finally {
      save.disabled = false;
      configurePick();
    }
  });
  function releaseURLs() { photoURLs.forEach(url => URL.revokeObjectURL(url)); photoURLs = []; }
  orderDialog.addEventListener('close',() => { if (!orderDialog.open) releaseURLs(); });
  orderDialog.addEventListener('cancel',event => { if (busy) event.preventDefault(); });
  get('#order-close').onclick = () => { if (!busy) orderDialog.close(); };
  function panel(title) {
    releaseURLs(); body.replaceChildren(); get('#order-title').textContent = title;
    get('#order-error').hidden = true;
    if (!orderDialog.open) orderDialog.showModal();
    orderDialog.scrollTop = 0;
  }
  function productLine(line, src) {
    const row = el('div',undefined,'order-line');
    const img = el('img'); img.src = src; img.alt = line.code + ' の商品写真';
    const desc = el('div',undefined,'item-copy');
    desc.append(el('strong',line.code),el('small',line.name));
    row.append(img,desc,el('strong',line.qty + ' 点'));
    return row;
  }
  function drawCart() {
    panel('テスト注文の確認');
    if (!draft.length) { body.append(el('p','カートは空です。商品を選び、点数を選んでください。')); return; }
    for (const line of draft) {
      const row = productLine(line,line.image);
      const edit = action('変更',() => {
        orderDialog.close();
        const card = cards.find(c => c.dataset.code === line.code);
        if (card) {
          search.value = line.code;
          filters.find(b => b.dataset.filter === 'all').click();
          show(card);
        }
      });
      const remove = action('削除',() => run(async () => {
        await changeDraft(line.code,0,line.qty); drawCart();
      }));
      row.append(edit,remove); body.append(row);
    }
    body.append(el('p','合計 ' + qtyTotal(draft) + ' 点'));
    body.append(el('p','この端末にテスト注文として保存します。仕入先への送信はありません。','test-note'));
    const save = action('テスト注文を確定',() => run(async () => {
      save.disabled = true; save.textContent = '保存中…';
      try {
        const order = await checkout(draft);
        await changeView('history');
        await showOrder(order);
      } finally { save.disabled = false; save.textContent = 'テスト注文を確定'; }
    }),true);
    body.append(save);
  }
  // 注文時の写真を端末に保存する。画像が差し替わっても履歴は同じ写真を使う。
  async function checkout(lines) {
    if (!lines.length) throw new Error('商品を選んでください。');
    const db = await database();
    const photos = new Map();
    if (location.protocol !== 'file:') {
      for (const src of new Set(lines.map(line => line.image))) {
        const exists = await read(db.transaction('photos').objectStore('photos').getKey(src));
        if (exists !== undefined) continue;
        const resp = await fetch(src);
        if (!resp.ok || !resp.headers.get('Content-Type')?.startsWith('image/')) throw new Error('商品写真を取得できません。通信を確認し、もう一度お試しください。');
        // WebKitのプライベート閲覧でも写真を保存できるよう、バイト列を使う。
        photos.set(src,await resp.arrayBuffer());
      }
    }
    const tx = db.transaction(['orders','draft','photos'],'readwrite');
    const done = completed(tx);
    const current = tx.objectStore('draft').getAll();
    const order = {type:'test',created:new Date().toISOString(),items:lines,total:qtyTotal(lines)};
    current.onsuccess = () => {
      if (JSON.stringify(current.result) !== JSON.stringify(lines)) { tx.abort(); return; }
      photos.forEach((bytes,key) => tx.objectStore('photos').put(bytes,key));
      const req = tx.objectStore('orders').add(order);
      req.onsuccess = () => { order.id = req.result; };
      tx.objectStore('draft').clear();
    };
    try { await done; } catch (error) {
      draft = await all('draft'); updateBar(); drawCart(); throw error;
    }
    draft = []; updateBar();
    return order;
  }
  async function showOrder(order) {
    panel('テスト注文 ' + number(order.id));
    body.append(el('p',dateLabel(order.created) + '　合計 ' + order.total + ' 点'));
    const db = await database();
    for (const item of order.items) {
      const stored = await read(db.transaction('photos').objectStore('photos').get(item.image));
      const blob = stored instanceof ArrayBuffer ? new Blob([stored], {type:'image/jpeg'}) : stored;
      const url = blob ? URL.createObjectURL(blob) : item.image;
      if (blob) photoURLs.push(url);
      body.append(productLine(item,url));
    }
    const buttons = el('div',undefined,'order-actions');
    buttons.append(action('印刷・PDF保存',() => window.print()));
    body.append(buttons);
  }
  async function history() {
    const list = get('#history-list');
    const orders = await all('orders');
    list.replaceChildren();
    get('#history-empty').hidden = orders.length > 0;
    for (const order of orders.reverse()) {
      const btn = el('button',undefined,'history-row');
      const label = el('span','テスト注文 ' + number(order.id));
      label.append(el('small',dateLabel(order.created)));
      btn.append(label,el('strong',order.total + ' 点　›'));
      btn.onclick = () => run(() => showOrder(order));
      list.append(btn);
    }
  }
  async function changeView(next) {
    view = next;
    tabs.forEach(b => {
      if (b.dataset.view === next) b.setAttribute('aria-current','page');
      else b.removeAttribute('aria-current');
    });
    get('#test-note').hidden = next === 'catalog';
    get('#catalog-view').hidden = next === 'history';
    get('#history-view').hidden = next !== 'history';
    get('#cart-bar').hidden = next !== 'create';
    get('#order-message').hidden = true;
    if (next === 'create') { draft = await all('draft'); updateBar(); }
    if (next === 'history') await history();
    window.scrollTo(0,0);
  }
  tabs.forEach(b => b.onclick = () => run(() => changeView(b.dataset.view)));
  get('#cart-bar').onclick = () => run(async () => { draft = await all('draft'); updateBar(); drawCart(); });
})();
</script>
